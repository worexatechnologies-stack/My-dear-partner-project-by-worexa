name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend (Next.js & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm run test

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  backend-ci:
    name: Backend (Django & Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-build-verification-secret-key-1234567890
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ':memory:'
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: 5432
      PAYMENT_MODE: manual_approval
      RENFLAIR_API_KEY: ci-placeholder-api-key
      DEFAULT_FROM_EMAIL: support@mydearpartner.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements/base.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/production.txt

      - name: Verify Python syntax and bytecode compilation
        run: |
          python -m compileall apps config -q

      - name: Run Django system check
        run: |
          python manage.py check

      - name: Check for uncommitted database migrations
        run: |
          python manage.py makemigrations --check --dry-run

  docker-ci:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
        env:
          SECRET_KEY: ci-secret-key-placeholder
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_PASSWORD: ci-db-password-placeholder
          RENFLAIR_API_KEY: ci-renflair-placeholder
